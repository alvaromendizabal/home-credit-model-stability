repos:
  - repo: local
    hooks:
      - id: source-integrity
        name: source integrity
        entry: python3 scripts/source_check.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
