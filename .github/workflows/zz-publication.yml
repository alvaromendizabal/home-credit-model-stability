name: Apply selected credit-risk project
on:
  push:
    branches: [cleanup/final-project-20261018]
    paths: [.github/workflows/zz-publication.yml]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HOME_CREDIT_NOTEBOOK_INTEGRATION: '1'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.10'
          python-version: '3.12.14'
          enable-cache: false
      - name: Apply final selected release scope
        run: |
          python3 .cleanup/apply.py
          git rm -rf .cleanup
      - name: Install the original locked model environment
        run: uv sync --locked --group dev
      - name: Re-execute only the canonical selected-model reviews
        run: |
          uv run --locked ruff format src scripts tests
          uv run --locked python scripts/review_model_tuning.py --force
          uv run --locked python scripts/review_model_selection.py --force
          uv run --locked python scripts/review_model_release.py --force
          uv run --locked python scripts/review_submission.py --force
          uv run --locked python scripts/review_model_benchmark.py --force
          uv run --locked python scripts/review_feature_ablation.py
          uv run --locked python scripts/review_portfolio_overview.py
      - name: Verify all retained source, model, temporal and inference contracts
        run: |
          bash scripts/check.sh
          python3 -W error scripts/review_public_evidence.py --output "$RUNNER_TEMP/public-review"
          python3 -W error scripts/review_public_evidence.py --output "$RUNNER_TEMP/public-review" --check
          python3 -W error scripts/review_portfolio_brief.py --output reports/portfolio/brief --check
          node demo/model.test.mjs
      - name: Publish source and genuine notebook outputs only
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire unpromoted credit-risk studies; retain the selected model release and evidence'
          git push origin HEAD:cleanup/final-project-20261018
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selected-credit-source
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/commit.txt
          retention-days: 3
          if-no-files-found: error
