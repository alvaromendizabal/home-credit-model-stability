name: Temporary public source audit
on:
  push:
    branches: [cleanup/public-surface-20261018]
    paths: [.github/workflows/zz-closeout-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the eight authorized public repositories
        shell: python
        run: |
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-sources'
          out.mkdir()
          specs={
            'home-credit-model-stability':'213e6eea9636b50f66b1bc8fbf15b1a623f2f4aa',
            'nfl-player-trajectory':'06f9888568de2b0681690462593b85842a4bc324',
            'jigsaw-rule-classifier':'59b5b3da302e41318447042f6326694dd879c866',
            'commodity-prediction':'154c0937e86f17139ddeff2ac2110eeedf8a08bb',
            'kaggriculture':'006a2dc529472d0dd221fb76b90bb07a8f147ee2',
            'lava-aws-multilingual-docvqa':'b9b5cc853bb1b32c3876c6fe3829fa92eedb2148',
            'biohub-cell-tracking-during-development':'075b9541dedf46c105c6a967d59b7f2fe37b6bb1',
            'rsna-knee-abnormality-detection':'080f5e5dfcc70439a2e95aafa7cabf9dfb42dd30'}
          def get(url):
              request=urllib.request.Request(url,headers={'User-Agent':'public-portfolio-closeout','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=90) as response:return response.read()
          def read(item):
              name,sha=item
              data=get(f'https://codeload.github.com/alvaromendizabal/{name}/zip/{sha}')
              (out/(name+'.zip')).write_bytes(data)
              info=json.loads(get(f'https://api.github.com/repos/alvaromendizabal/{name}/git/commits/{sha}'))
              runs=json.loads(get(f'https://api.github.com/repos/alvaromendizabal/{name}/actions/runs?head_sha={sha}&per_page=100'))
              (out/(name+'.json')).write_text(json.dumps({'commit':info,'runs':runs},indent=2))
              return {'repository':name,'sha':sha,'tree':info['tree']['sha'],'zip_sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: records=list(pool.map(read,specs.items()))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eight-repository-source-audit
          path: ${{ runner.temp }}/audit-sources/
          if-no-files-found: error
          retention-days: 3
