name: Repository hygiene
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  navigation-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check maintained source and all Markdown and notebook navigation
        shell: python
        run: |
          import json
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          paths = [p for p in subprocess.check_output(
              ['git', 'ls-files', '-z'], text=True).split('\0') if p]
          errors = []
          links = 0
          markdown_files = 0
          notebooks = 0
          for name in paths:
              path = Path(name)
              if any(p in {'__pycache__', '.ipynb_checkpoints', 'node_modules', '.venv'} for p in path.parts):
                  errors.append(f'Generated environment/cache tracked: {name}')
              if path.name == '.DS_Store' or any(p.startswith('.cleanup') for p in path.parts):
                  errors.append(f'Temporary preparation file tracked: {name}')
              if name.startswith('.github/workflows/zz-') or name.endswith('.pyz') or '_return_' in path.name:
                  errors.append(f'Temporary workflow or run handoff tracked: {name}')
              if path.suffix.lower() == '.md':
                  texts = [(root / name).read_text(encoding='utf-8')]
                  markdown_files += 1
              elif path.suffix.lower() == '.ipynb':
                  notebook = json.loads((root / name).read_text(encoding='utf-8'))
                  texts = [''.join(c.get('source', [])) for c in notebook.get('cells', [])
                           if c.get('cell_type') == 'markdown']
                  notebooks += 1
              else:
                  continue
              for text in texts:
                  text = re.sub(r'(?ms)^```[^\n]*\n.*?^```[^\n]*$', '', text)
                  for target in re.findall(r'\]\(([^\s)]+)', text):
                      parsed = urlsplit(target.strip('<>'))
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      links += 1
                      dest = (root / path.parent / unquote(parsed.path)).resolve()
                      if not dest.is_relative_to(root) or not dest.exists():
                          errors.append(f'Broken or out-of-repository link: {name} -> {target}')
          print(json.dumps({'tracked_files': len(paths), 'markdown_files': markdown_files,
                            'notebooks': notebooks, 'local_file_links': links,
                            'errors': errors}, indent=2))
          if errors:
              raise SystemExit(1)
