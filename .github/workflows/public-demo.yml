name: Public demo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify static publication boundaries and actual browser controls
        run: |
          python -m unittest discover -s tools -p 'test_public_demo_boundary.py'
          python tools/check_public_demo.py > "$RUNNER_TEMP/public-demo-boundary.json"
          node demo/model.test.mjs
          node demo/app.test.mjs
      - name: Stage only the four reviewed public assets
        run: |
          mkdir -p "$RUNNER_TEMP/public-demo"
          cp demo/index.html demo/styles.css demo/model.mjs demo/app.mjs "$RUNNER_TEMP/public-demo/"
          python tools/check_public_demo.py --root "$RUNNER_TEMP/public-demo"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-demo
          path: ${{ runner.temp }}/public-demo/
          if-no-files-found: error
          retention-days: 14
