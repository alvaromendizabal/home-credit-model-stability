name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HOME_CREDIT_NOTEBOOK_INTEGRATION: '1'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.10'
          python-version: '3.12.14'
          enable-cache: true
      - name: Independently reproduce the committed public evidence
        run: |
          python3 -W error scripts/review_public_evidence.py --output "$RUNNER_TEMP/public-review"
          python3 -W error scripts/review_public_evidence.py --output "$RUNNER_TEMP/public-review" --check
          cmp "$RUNNER_TEMP/public-review/review.json" reports/public_review/review.json
          cmp "$RUNNER_TEMP/public-review/index.html" reports/public_review/index.html
      - run: uv sync --locked --group dev
      - name: Execute every retained selected-model review
        run: |
          uv run --locked python scripts/review_model_tuning.py --force
          uv run --locked python scripts/review_model_selection.py --force
          uv run --locked python scripts/review_model_release.py --force
          uv run --locked python scripts/review_submission.py --force
          uv run --locked python scripts/review_model_benchmark.py --force
      - name: Test all retained code, types and failure paths
        run: bash scripts/check.sh
      - name: Reproduce the selected feature evidence and overview
        run: |
          uv run --locked python -W error scripts/review_portfolio_overview.py
          uv run --locked mypy scripts/review_portfolio_overview.py
          uv run --locked python scripts/review_feature_ablation.py
          git diff --exit-code -- reports/portfolio/overview.svg reports/feature_ablation/overview.svg
      - name: Execute original ablation notebook without rewriting its evidence
        run: |
          uv run --locked python - <<'PY'
          import shutil
          from pathlib import Path
          from home_credit.observability.logging import RunLogger
          from home_credit.runtime.notebooks import execute_notebook
          root = Path.cwd()
          directory = root / 'artifacts/ci/feature_ablation'
          directory.mkdir(parents=True, exist_ok=True)
          for name in ('06_feature_ablation.ipynb', 'comparison.json'):
              shutil.copy2(root / 'reports/feature_ablation' / name, directory / name)
          execute_notebook(root, directory / '06_feature_ablation.ipynb',
              RunLogger('ablation-review-ci', root / 'logs'),
              dependencies=[directory / 'comparison.json', root / 'uv.lock'],
              receipt_path=directory / 'receipt.json', execution_root=directory)
          PY
      - name: Prove unchanged notebook reuse and byte identity
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from scripts.review_model_selection import review as selection
          from home_credit.modeling.portfolio_report import review_portfolio
          from scripts.review_submission import review as submission
          root = Path.cwd()
          if not selection(root) or not all(review_portfolio(root).values()) or not submission(root):
              raise RuntimeError('Unchanged notebook did not reuse verified outputs')
          print('RETAINED_NOTEBOOK_REUSE_VERIFIED')
          PY
          git diff --exit-code -- notebooks/05_benchmark_review.ipynb notebooks/08_model_selection.ipynb notebooks/02_feature_engineering.ipynb notebooks/09_model_release.ipynb notebooks/10_submission.ipynb reports/benchmark/review.json reports/model_selection reports/model_release/publication.json reports/public_review
      - name: Retain the executed public review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selected-model-reviews
          path: |
            notebooks/*.ipynb
            artifacts/ci/feature_ablation/06_feature_ablation.ipynb
            reports/public_review/
            reports/model_release/publication.json
          if-no-files-found: error
          retention-days: 14
