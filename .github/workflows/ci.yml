name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12.14"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev
      - name: Run quality gates
        run: bash scripts/check.sh
