name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12.14"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev
      - name: Preserve isolated validation environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/validated-model-release'
        run: |
          uv run --locked python - <<'PY'
          import sys, sysconfig, tarfile
          from pathlib import Path
          Path("artifacts/ci").mkdir(parents=True, exist_ok=True)
          def included(member):
              if member.name.endswith((".ttf", ".otf", ".ttc", ".woff", ".woff2")):
                  return None
              return member
          with tarfile.open("artifacts/ci/runtime.tar.gz", "w:gz") as archive:
              archive.add(sys.base_prefix, arcname="python", filter=included)
              archive.add(sysconfig.get_paths()["purelib"], arcname="site-packages", filter=included)
          PY
      - name: Preserve isolated runtime for direct validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/validated-model-release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-runtime
          path: artifacts/ci/runtime.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Normalize release candidate source
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/validated-model-release'
        run: |
          files=()
          for path in src/home_credit/modeling/release.py src/home_credit/modeling/inference.py src/home_credit/modeling/release_workflow.py src/home_credit/modeling/release_report.py src/home_credit/modeling/selection_report.py scripts/run_model_release.py scripts/review_model_selection.py scripts/review_model_release.py tests/unit/test_model_release.py tests/unit/test_inference.py tests/unit/test_release_workflow.py tests/unit/test_selection_review.py tests/integration/test_release_notebooks.py; do
            if test -f "$path"; then files+=("$path"); fi
          done
          uv run --locked ruff format "${files[@]}"
          uv run --locked ruff check --fix "${files[@]}"
      - name: Execute canonical tuning review
        run: uv run --locked python scripts/review_model_tuning.py --force
      - name: Run quality gates
        env:
          HOME_CREDIT_NOTEBOOK_INTEGRATION: "1"
        run: bash scripts/check.sh
      - name: Execute benchmark review notebook
        run: uv run --locked python scripts/review_model_benchmark.py --force
      - name: Verify published benchmark is reproducible
        run: git diff --exit-code -- notebooks/05_benchmark_review.ipynb reports/benchmark/review.json
      - name: Reproduce accepted ablation figure
        run: |
          uv run --locked python scripts/review_feature_ablation.py
          git diff --exit-code -- reports/feature_ablation/overview.svg
      - name: Execute accepted ablation notebook without replacing historical evidence
        run: |
          uv run --locked python - <<'PY'
          import shutil
          from pathlib import Path
          from home_credit.observability.logging import RunLogger
          from home_credit.runtime.notebooks import execute_notebook
          root = Path.cwd()
          directory = root / "artifacts/ci/feature_ablation"
          directory.mkdir(parents=True, exist_ok=True)
          for name in ("06_feature_ablation.ipynb", "comparison.json"):
              shutil.copy2(root / "reports/feature_ablation" / name, directory / name)
          execute_notebook(
              root, directory / "06_feature_ablation.ipynb",
              RunLogger("ablation-review-ci", root / "logs"),
              dependencies=[directory / "comparison.json", root / "uv.lock"],
              receipt_path=directory / "receipt.json", execution_root=directory,
          )
          PY
      - name: Execute published selection and release reviews
        run: |
          if test -f reports/model_selection/selection.json && test -f scripts/review_model_selection.py; then
            uv run --locked python scripts/review_model_selection.py --force
          fi
          if test -f reports/model_release/evaluation.json && test -f scripts/review_model_release.py; then
            uv run --locked python scripts/review_model_release.py --force
          fi
      - name: Preserve executed reviews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-reviews
          path: |
            notebooks/*.ipynb
            artifacts/ci/feature_ablation/06_feature_ablation.ipynb
            reports/benchmark/review.json
            logs/*review*.jsonl
          if-no-files-found: error
      - name: Publish checked canonical source and notebook outputs on feature branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          git add notebooks
          if test "$REVIEW_BRANCH" = feat/validated-model-release; then
            git add src scripts tests
            for path in reports/model_selection reports/model_release; do
              if test -d "$path"; then git add "$path"; fi
            done
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'style: normalize checked source and publish executed reviews'
            git push origin "HEAD:$REVIEW_BRANCH"
          fi
      - name: Preserve validation source and locked formatter
        if: always()
        run: |
          git ls-files -z | tar --null --verbatim-files-from -T - -cf repository-source.tar
          mkdir -p artifacts/ci/tools
          if test -f .venv/bin/ruff; then cp .venv/bin/ruff artifacts/ci/tools/ruff; fi
      - name: Preserve reproducibility source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-source
          path: |
            repository-source.tar
            artifacts/ci/tools/ruff
          if-no-files-found: error
          retention-days: 1
